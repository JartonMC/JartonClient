name: Staff Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: Publish this build as a release on JartonMC/JartonClient-Staff
        type: boolean
        default: false
  push:
    branches: [wf/staff-edition]
    paths: [.github/workflows/staff-build.yml]

permissions: {}

jobs:
  build:
    name: Build (Staff-Windows-MSVC)

    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write

    runs-on: windows-2022

    defaults:
      run:
        shell: bash

    env:
      ARTIFACT_NAME: Staff-Windows-MSVC-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: Release
      CMAKE_PRESET: windows_msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: Staff-Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.10.2
          # staff extras: qtwebview backs the embedded Swifty board (WebView2 on
          # Windows), qtwebsockets backs the live wings console
          qt-modules: qtimageformats qtnetworkauth qtwebview qtwebsockets

      # BUILD_ARTIFACT stays the standard Windows-MSVC-Qt6 (explicit -D beats the
      # preset's $penv{ARTIFACT_NAME}) so the in-app updater matches release assets
      # the same way the public build does; the staff/public split happens through
      # the repo URL, and the CI artifact name below stays staff-prefixed.
      - name: Configure project
        run: |
          cmake --preset "$CMAKE_PRESET" -DLauncher_STAFF=ON \
            -DLauncher_UPDATER_GITHUB_REPO=https://updates.jarton.me/staff \
            -DLauncher_JARTON_UPDATE_KEY=${{ secrets.JARTON_UPDATE_KEY }} \
            -DLauncher_BUILD_ARTIFACT=Windows-MSVC-Qt6

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Run tests
        run: |
          ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE"

      - name: Get short version
        id: short-version
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install (portable layout)
        shell: pwsh
        run: |
          cmake --install build --config ${{ env.BUILD_TYPE }}
          cmake --install build --config ${{ env.BUILD_TYPE }} --component portable

      # the shared deploy script runs windeployqt with --no-quick-import; the
      # public client has no QML so that's fine, but the staff panel needs the
      # QtQuick + QtWebView QML modules deployed alongside the exe
      - name: Deploy staff QML modules
        shell: pwsh
        run: |
          $exe = Get-ChildItem install -Filter jartonclient.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "jartonclient.exe not found in install/" }
          windeployqt --release --qmldir launcher/qml $exe.FullName
          if (-not (Test-Path "$($exe.DirectoryName)/qml/QtWebView")) {
            throw "QtWebView QML module missing after deploy"
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: JartonClient-Staff-Windows-Portable-${{ steps.short-version.outputs.version }}-${{ env.BUILD_TYPE }}
          path: install/**

      # Tag and asset name mirror release.yml's conventions on the public repo:
      # bare version tag (no v prefix) because the launcher's self-updater builds
      # releases/download/<version>/JartonClient-Windows-MSVC-Portable-<version>.zip
      # straight from the manifest version string.
      - name: Read launcher version
        id: launcher-version
        run: |
          part() { sed -n "s/^set(Launcher_VERSION_$1 \([0-9]*\)).*/\1/p" CMakeLists.txt; }
          echo "version=$(part MAJOR).$(part MINOR).$(part PATCH)" >> "$GITHUB_OUTPUT"

      # Installer asset name must contain "Windows-MSVC" and not "Portable" — the
      # in-app updater picks the .exe for installed copies and the zip for portable.
      - name: Package staff installer
        shell: pwsh
        env:
          NSCURL_VERSION: "v24.9.26.122"
          NSCURL_SHA256: "AEE6C4BE3CB6455858E9C1EE4B3AFE0DB9960FA03FE99CCDEDC28390D57CCBB0"
          VERSION: ${{ steps.launcher-version.outputs.version }}
        run: |
          New-Item -Name NSISPlugins -ItemType Directory
          Invoke-Webrequest https://github.com/negrutiu/nsis-nscurl/releases/download/"${{ env.NSCURL_VERSION }}"/NScurl.zip -OutFile NSISPlugins\NScurl.zip
          $nscurl_hash = Get-FileHash NSISPlugins\NScurl.zip -Algorithm Sha256 | Select-Object -ExpandProperty Hash
          if ( $nscurl_hash -ne "${{ env.NSCURL_SHA256 }}") {
            echo "::error:: NSCurl.zip sha256 mismatch"
            exit 1
          }
          Expand-Archive -Path NSISPlugins\NScurl.zip -DestinationPath NSISPlugins\NScurl
          cd install
          makensis -NOCD "${{ github.workspace }}/build/program_info/win_install.nsi"
          cd ..
          Move-Item JartonClientStaff-Setup.exe "JartonClientStaff-Windows-MSVC-Setup-$env:VERSION.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: JartonClient-Staff-Windows-Setup-${{ steps.short-version.outputs.version }}-${{ env.BUILD_TYPE }}
          path: JartonClientStaff-Windows-MSVC-Setup-*.exe

      - name: Package staff release zip
        if: inputs.make_release
        env:
          VERSION: ${{ steps.launcher-version.outputs.version }}
        run: |
          cd install
          7z a -tzip "../JartonClient-Windows-MSVC-Portable-${VERSION}.zip" *

      # STAFF_RELEASE_TOKEN is a PAT with repo scope on JartonMC/JartonClient-Staff;
      # the job's own GITHUB_TOKEN can't write releases to another repo. Until the
      # secret is added this step skips with a warning instead of failing the build.
      - name: Create staff release
        if: inputs.make_release
        env:
          GH_TOKEN: ${{ secrets.STAFF_RELEASE_TOKEN }}
          VERSION: ${{ steps.launcher-version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::STAFF_RELEASE_TOKEN secret is not set; skipping staff release upload."
            exit 0
          fi
          gh release create "$VERSION" \
            --repo JartonMC/JartonClient-Staff \
            --title "Jarton Client Staff $VERSION" \
            --notes "Staff Edition $VERSION (build ${GITHUB_SHA::7})" \
            "JartonClient-Windows-MSVC-Portable-${VERSION}.zip"
